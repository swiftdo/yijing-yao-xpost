<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>{{GUA_LABEL}} · {{TAG}}</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    width: 1600px; height: 900px; overflow: hidden;
    font-family: "Noto Serif CJK SC", "Noto Serif CJK", serif;
    color: #2f2c26;
    -webkit-font-smoothing: antialiased;
  }
  .sans { font-family: "Noto Sans CJK SC", "Noto Sans CJK", sans-serif; }
  .card { position: relative; width: 1600px; height: 900px; }
  .bg { position: absolute; inset: 0; background: url("ink_bg.png") center center / cover no-repeat; }
  .veil {
    position: absolute; inset: 0;
    background: linear-gradient(90deg,
      rgba(247,244,237,.56) 0%,
      rgba(247,244,237,.68) 28%,
      rgba(248,245,238,.90) 52%,
      rgba(249,246,239,.965) 72%,
      rgba(249,247,240,.98) 100%);
  }
  .content { position: absolute; inset: 56px 70px; display: flex; }
  .left {
    width: 590px; flex-shrink: 0;
    padding-right: 48px;
    border-right: 1px solid rgba(70,66,58,.22);
  }
  .right { flex: 1; padding-left: 56px; }

  /* 左栏：卦象 */
  .eyebrow { font-size: 23px; letter-spacing: .22em; color: #7d776b; }
  .sub { font-size: 27px; letter-spacing: .1em; color: #565044; margin-top: 10px; }
  .gua { margin-top: 48px; }
  .yao { display: flex; align-items: center; height: 78px; }
  .bar {
    width: 202px; height: 22px; flex-shrink: 0; border-radius: 2px;
    background: linear-gradient(180deg, #4a463e, #37342e);
  }
  .bar.yin { background: none; display: flex; justify-content: space-between; }
  .bar.yin i {
    display: block; width: 44%; height: 100%; border-radius: 2px;
    background: linear-gradient(180deg, #4a463e, #37342e);
  }
  .bar.hot { background: linear-gradient(180deg, #b34b3d, #9c3c31); }
  /* 阴爻高亮时父容器必须保持透明，只让两段变红 */
  .bar.yin.hot { background: none; }
  .bar.yin.hot i { background: linear-gradient(180deg, #b34b3d, #9c3c31); }
  .name { font-size: 27px; margin-left: 28px; width: 82px; color: #474239; }
  .name.hot { color: #a64236; }
  .note { font-size: 20px; color: #8a8478; letter-spacing: .04em; white-space: nowrap; }
  .note.hot { color: #a64236; font-weight: 600; }
  .split { height: 44px; display: flex; align-items: center; gap: 16px; }
  .split .dash { width: 202px; border-top: 1px dashed rgba(90,84,74,.6); }
  .split .lab { font-size: 19px; color: #827c70; letter-spacing: .08em; white-space: nowrap; }
  .foot { margin-top: 24px; font-size: 21px; line-height: 2; color: #6e685d; }
  .foot b { font-weight: 500; color: #a64236; }

  /* 右栏：爻解 */
  .topline { display: flex; justify-content: space-between; align-items: center; }
  .tag { display: flex; align-items: center; gap: 14px; font-size: 24px; letter-spacing: .2em; color: #5b554b; }
  .tag i { width: 15px; height: 15px; background: #a64236; display: block; }
  .seal {
    width: 46px; height: 46px; background: #a64236; color: #f7f1e6;
    display: flex; align-items: center; justify-content: center;
    font-size: 27px; line-height: 1; border-radius: 2px;
  }
  .title {
    margin-top: 20px; font-size: 68px; line-height: 1.22;
    letter-spacing: .09em; color: #292620; font-weight: 500;
  }
  .rule { height: 1px; background: rgba(70,66,58,.22); margin: 18px 0 16px; }
  .label { font-size: 22px; letter-spacing: .26em; color: #a64236; margin-bottom: 12px; }
  .srcbox {
    background: rgba(255,255,255,.48);
    border-left: 3px solid #a64236;
    padding: 16px 24px 18px;
  }
  .src1 { font-size: 31px; letter-spacing: .04em; color: #2f2b24; }
  .src2 { font-size: 26px; color: #4e4a42; margin-top: 12px; letter-spacing: .03em; }
  .src3 { font-size: 23px; color: #5c574d; line-height: 1.55; margin-top: 10px; letter-spacing: .01em; }
  .pos { margin-top: 20px; }
  .points { font-size: 25px; line-height: 1.72; color: #3b372f; }
  .points div { white-space: nowrap; }
  .points span { color: #a64236; margin-right: 12px; }
  .bottom {
    margin-top: 26px; padding-top: 14px;
    border-top: 1px solid rgba(70,66,58,.2);
    font-size: 21px; letter-spacing: .06em; color: #7b7568;
  }
</style>
</head>
<body>
<div class="card">
  <div class="bg"></div>
  <div class="veil"></div>
  <div class="content">

    <div class="left">
      <div class="eyebrow sans">{{GUA_LABEL}}</div>
      <div class="sub">{{GUAXIANG}}</div>
      <div class="gua">
{{YAO_ROWS}}
      </div>
      <div class="foot">
        {{FOOT1}}<br>
        {{FOOT2}}
      </div>
    </div>

    <div class="right">
      <div class="topline">
        <div class="tag sans"><i></i>{{TAG}}</div>
        <div class="seal">{{SEAL}}</div>
      </div>

      <div class="title">{{TITLE}}</div>

      <div class="rule"></div>

      <div class="label sans">原 文</div>
      <div class="srcbox">
        <div class="src1">{{SRC1}}</div>
{{SRC2_BLOCK}}
{{SRC3_BLOCK}}
      </div>

      <div class="pos">
        <div class="label sans">所 处 之 位</div>
        <div class="points">
{{POINTS}}
        </div>
      </div>

      <div class="bottom sans">{{BOTTOM}}</div>
    </div>

  </div>
</div>
</body>
</html>
